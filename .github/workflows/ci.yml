name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: npx --yes htmlhint "*.html"

      - name: Validate sitemap.xml
        run: xmllint --noout sitemap.xml
